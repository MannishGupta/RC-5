; Resource Centre — domain PHP limits (3.2.64)
; Prefer .user.ini on Plesk/IIS FastCGI when this file is not auto-loaded.
date.timezone = Asia/Kolkata
upload_max_filesize = 40M
post_max_size = 48M
max_file_uploads = 25
max_execution_time = 180
max_input_time = 180
memory_limit = 256M
session.gc_maxlifetime = 31536000
